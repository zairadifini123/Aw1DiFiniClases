<!--Esto le dice que es un documento html, no tiene cierre -->
<!DOCTYPE html>

<!--Elemento raiz (root) del documento, tiene dos desendientes (head, body) -->
<html>
    <!--Lo que no se ve pero es importante, no se renderiza -->
    <head>
        <!-- Nombre de la pestaña -->
        <title>Gimnasio</title>
    </head>

    <!--Si se renderiza en el viewport(porcion del navegador que muestra la pagina)-->
    <body>
        <!-- Header, titulo. h1 hasta h6 (Jerarquia) -->
        <h1>Bienvenidos</h1>
        <h2>Momento de entrenar</h2>
        <!-- Parrafo, lorem20 para que se haga un texto y ver como quedaria -->
        <p>
            Lorem ipsum dolor sit amet consectetur adipisicing elit. Harum, nobis? Possimus esse ipsum quibusdam sint tempora corporis impedit molestiae laboriosam!
        </p>
    </body>
</html>
