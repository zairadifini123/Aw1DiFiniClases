<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huellitas</title>
</head>
<body>
    <header>
        <a href="./index.html" aria-label="Ir al inicio">
            <img src="./recursos/imagenes/huella.png" alt="Logo tienda"> 
        </a> 
       <nav>
            <a href="./index.html">
                Inicio
            </a>
            <a href="./catalogo.html">
                Catálogo
            </a>
            <a href="./contacto.html">
                Contacto
            </a>
       </nav> 
    </header>

    <main>
        <h1>Contacto</h1>
        <h2>Escribinos</h2>
        <form action="./contacto.html" method="post">
            <label for="id-nombre">Nombre</label>
            <input type="text" name="nombre" id="id-nombre">

            <label for="id-telefono">Teléfono </label>
            <input type="tell" name="telefono" id="id-telefono">

            <label for="id-tamaño-mascota">Tamaño de la mascota</label>
            <select name="tamaño-mascota" id="id-tamaño-mascota">
                <option value="C">Chico</option>
                <option value="M">Mediano</option>
                <option value="G">Chico</option>
            </select>

            <label for="id-edad">Edad</label>
            <input type="number" name="edad" id="id-edad" min="1" max="20">

            <label for="id-comentario">Comentario sobre la mascota</label>
            <textarea name="comentario" id="id-comentario"></textarea>

            <!-- <input type="submit" value="Enviar"> -->

            <button type="reset">
                Limpiar
            </button>
            <button type="submit">
                Enviar
            </button>
        </form>
        <h2>Donde estamos</h2>
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3404.7899732760334!2d-64.1914771237341!3d-31.41991219642294!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x9432a286a09424ab%3A0x637dd38a25e5eb11!2sBlvd.%20San%20Juan%20200%2C%20X5022%20C%C3%B3rdoba!5e0!3m2!1ses-419!2sar!4v1788354718344!5m2!1ses-419!2sar" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
    </main>

    <footer>
        <ul>
            <li>
                <a href="https://instagram.com/@huellitas" target="_blank">
                    @huellitas
                </a>
            </li>
            <li>
                Bv. San Juan 200 - Bº Nueva Córdoba
            </li>
        </ul>

    </footer>
</body>
</html>
